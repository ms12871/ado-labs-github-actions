name: Terraform

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    name: Terraform format and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.0.10

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Initialize main configuration
        run: terraform -chdir=main init -backend=false -input=false

      - name: Validate main configuration
        run: terraform -chdir=main validate

      - name: Initialize remote setup configuration
        run: terraform -chdir=remote_setup init -backend=false -input=false

      - name: Validate remote setup configuration
        run: terraform -chdir=remote_setup validate

  plan-and-apply:
    name: Terraform plan and apply
    needs: validate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
      STORAGE_ACCOUNT: ${{ secrets.STORAGE_ACCOUNT }}
      CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}

    defaults:
      run:
        shell: bash
        working-directory: ./main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.0.10

      - name: Terraform Init
        run: >-
          terraform init -input=false
          -backend-config="storage_account_name=$STORAGE_ACCOUNT"
          -backend-config="container_name=$CONTAINER_NAME"
          -backend-config="resource_group_name=$RESOURCE_GROUP"

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false -no-color

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve